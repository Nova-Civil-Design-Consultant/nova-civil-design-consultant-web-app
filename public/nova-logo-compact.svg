<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CC2222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AA1111;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="buildingSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CC2222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991111;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="buildingTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Building 3D Structure (smaller) -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Building base (front face) -->
    <rect x="0" y="20" width="40" height="50" fill="url(#buildingGradient)" stroke="#990000" stroke-width="0.5"/>
    
    <!-- Building side (right face) -->
    <polygon points="40,20 55,10 55,60 40,70" fill="url(#buildingSide)" stroke="#770000" stroke-width="0.5"/>
    
    <!-- Building top -->
    <polygon points="0,20 15,10 55,10 40,20" fill="url(#buildingTop)" stroke="#990000" stroke-width="0.5"/>
    
    <!-- Windows on front face -->
    <rect x="5" y="28" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="15" y="28" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="25" y="28" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    
    <rect x="5" y="38" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="15" y="38" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="25" y="38" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    
    <rect x="5" y="48" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="15" y="48" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="25" y="48" width="6" height="6" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Door -->
    <rect x="15" y="58" width="10" height="12" fill="#660000"/>
  </g>

  <!-- NOVA Text (compact) -->
  <g transform="translate(80, 20)">
    <text x="0" y="35" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#DC2626" letter-spacing="-1px">NOVA</text>
    <text x="0" y="52" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#2563EB" letter-spacing="0.5px">BUILDING YOUR DREAM HOME BETTER</text>
  </g>
</svg>
